<!doctype html>
<html>

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        .primary {
            color: #fea928;
        }

        .secondary {
            color: #ed8900;
        }

        .custom_color {
            color: #ffcb7d;
            background-color: #f6d097;
        }
    </style>
</head>

<body id="body">
    <div class="container">
        <header class="m-0 items-center flex custom_color justify-between px-10 py-2">
            <div class="flex ">
                <img src="photos/shopsy/logo.png" alt="logo" class="size-10">
            </div>

            <div class="text-black flex items-center bg-red-500 ">
                <span id="healer" class="nav">Healer</span>
                <div class="bg-green-500 rounded-full flex px-4 py-1 ">
                    <input type="text" id="input_area" name="" placeholder="Search" class="focus:outline-none ">
                    <button class="flex" id="search">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                            stroke="currentColor" class="size-6 text-gray-400" >
                            <path stroke-linecap="round" stroke-linejoin="round"
                                d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z" />
                        </svg>
                    </button>
                </div>
            </div>

        </header>

    </div>
    <script>
        const search_btn = document.getElementById("search");
        const input_area = document.getElementById("input_area");
        const clickarea = document.querySelector("#body");

        // search_btn.addEventListener("click",() => {
        //     input_area.classList.toggle("hidden");
        //     input_area.focus();
        // });

        clickarea.addEventListener("click",()=>{
            if(!input_area.classList.contains("hidden")){
                input_area.classList.toggle("hidden");
            };
        });

    </script>
</body>

</html>
